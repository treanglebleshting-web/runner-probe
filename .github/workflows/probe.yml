name: probe
on: workflow_dispatch
jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: apt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xterm tesseract-ocr scrcpy ffmpeg 2>&1 | tail -2
      - name: sdk install
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "emulator" "system-images;android-33;google_apis;arm64-v8a" 2>&1 | tail -2
      - name: avd
        run: |
          echo no | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n btse -k "system-images;android-33;google_apis;arm64-v8a" -d pixel_7 2>&1 | tail -2
          $ANDROID_HOME/emulator/emulator -list-avds
      - name: boot
        run: |
          set -x
          ( $ANDROID_HOME/emulator/emulator -avd btse -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel auto -camera-back none -no-snapshot -verbose > /tmp/emu.log 2>&1 & )
          sleep 20
          if grep -qiE "error|failed" /tmp/emu.log; then echo "=== auto gagal, coba -accel off ==="; pkill -f emulator || true; sleep 3; ( $ANDROID_HOME/emulator/emulator -avd btse -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel off -camera-back none -no-snapshot -verbose > /tmp/emu.log 2>&1 & ); fi
          t0=$(date +%s)
          if timeout 780 bash -c 'adb wait-for-device; while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" != "1" ]; do sleep 5; done'; then
            echo "BOOT_OK in $(( $(date +%s)-t0 ))s"
            adb shell getprop ro.build.version.sdk; adb shell uname -m
            adb shell pm list packages | grep -c btse || true
          else
            echo "BOOT_FAIL"; tail -40 /tmp/emu.log
          fi
