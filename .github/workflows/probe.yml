name: probe
on: workflow_dispatch
jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: apt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xterm tesseract-ocr scrcpy ffmpeg 2>&1 | tail -1
      - name: cache sdk
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images
          key: sdk-arm64-v1
      - name: sdk install
        run: |
          set -o pipefail
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "emulator" "system-images;android-33;google_apis;arm64-v8a" 2>&1 | tail -1
      - name: avd
        run: |
          set -o pipefail
          echo no | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n btse -k "system-images;android-33;google_apis;arm64-v8a"
          echo "rc=$?"
          ls -la $HOME/.android/avd/ 2>&1
          $ANDROID_HOME/emulator/emulator -list-avds
          CFG=$HOME/.android/avd/btse.avd/config.ini
          grep -q hw.lcd.width $CFG || cat >> $CFG <<'EOC'
hw.lcd.width=1080
hw.lcd.height=2400
hw.lcd.density=420
EOC
          tail -5 $CFG
      - name: boot
        run: |
          ( $ANDROID_HOME/emulator/emulator -avd btse -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -no-snapshot -verbose > /tmp/emu.log 2>&1 & )
          t0=$(date +%s)
          if timeout 900 bash -c 'adb wait-for-device; while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" != "1" ]; do sleep 5; done'; then
            echo "BOOT_OK in $(( $(date +%s)-t0 ))s"
            adb shell getprop ro.build.version.sdk; adb shell wm size; adb shell uname -m
          else
            echo "BOOT_FAIL after $(( $(date +%s)-t0 ))s"; grep -iE "error|fatal|accel|kvm|failed" /tmp/emu.log | head -25
          fi
