name: ult_boot_arm64v2
on: workflow_dispatch
jobs:
  arm64_tcg:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: disk + start bg apk fetch
        run: |
          df -h / | tail -1
          if [ -f /tmp/apks/base.apk ]; then echo "APK_CACHE_HIT"; exit 0; fi
          mkdir -p /tmp/apks
          setsid nohup bash -c '
            curl -fL --connect-timeout 10 --retry 5 --retry-delay 5 --max-time 1500 \
              -o /tmp/ult_parts.tar.gz http://43.156.21.122:8081/ult_parts.tar.gz &&
            tar xzf /tmp/ult_parts.tar.gz -C /tmp/apks &&
            cp /tmp/apks/com.defi.wallet.apk /tmp/apks/base.apk &&
            touch /tmp/apks/READY
          ' > /tmp/fetch.log 2>&1 < /dev/null &
          echo "fetch started"
      - name: apk cache save-wrapper
        uses: actions/cache@v4
        with:
          path: /tmp/apks
          key: ult-apks-v1
      - name: sdk cache (arm64 image)
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images
          key: sdk-arm64img-v1
      - name: cmdline-tools + image + aarch64 emulator
        run: |
          set -e
          SDK=$HOME/android-sdk
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -fL --retry 3 -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/clt.zip -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "PATH=$SDK/platform-tools:$SDK/cmdline-tools/latest/bin:$PATH"
          } >> $GITHUB_ENV
          export PATH="$SDK/platform-tools:$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          for a in 1 2 3; do
            yes | sdkmanager "platform-tools" "system-images;android-33;google_apis;arm64-v8a" > /tmp/sdk.log 2>&1 && break
            tail -3 /tmp/sdk.log; sleep 10
          done
          sdkmanager --list_installed 2>&1 | tail -6 || true
          # aarch64 emulator from AOSP CI (official SDK repo has no linux-arm64 emulator)
          B=8632828
          if [ ! -x "$SDK/emulator/emulator" ]; then
            curl -fL --retry 3 -o /tmp/emu.zip \
              "https://ci.android.com/builds/submitted/$B/emulator-linux_aarch64/latest/sdk-repo-linux_aarch64-emulator-$B.zip"
            ls -la /tmp/emu.zip
            unzip -q -o /tmp/emu.zip -d "$SDK"
            rm -f /tmp/emu.zip
          fi
          ls "$SDK/emulator" | head
      - name: host libs for qemu
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq libpulse0 libnss3 libxss1 libxtst6 libxi6 libxrandr2 \
            libxcomposite1 libxcursor1 libxdamage1 libxfixes3 libgl1 libpng16-16t64 || true
          SDK=$HOME/android-sdk
          if [ -f "$SDK/emulator/qemu/linux-aarch64/qemu-system-aarch64" ]; then
            ldd "$SDK/emulator/qemu/linux-aarch64/qemu-system-aarch64" 2>&1 | grep "not found" || echo LIBS_OK
          else
            echo "qemu path listing:"; ls "$SDK/emulator/qemu/" 2>/dev/null || true; find "$SDK/emulator" -name "qemu-system*" | head
          fi
          "$SDK/emulator/emulator" -version 2>&1 | head -3 || echo EMULATOR_VERSION_FAILED
      - name: avd create
        run: |
          SDK=$HOME/android-sdk
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p $ANDROID_AVD_HOME
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> $GITHUB_ENV
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n ult -k "system-images;android-33;google_apis;arm64-v8a" || true
          CFG=$ANDROID_AVD_HOME/ult.avd/config.ini
          [ -f "$CFG" ] || { echo CFG_MISSING; exit 1; }
          for kv in hw.lcd.width=1080 hw.lcd.height=2400 hw.lcd.density=420 hw.ramSize=3072; do
            k=${kv%%=*}; v=${kv#*=}
            if grep -q "^$k=" $CFG; then sed -i "s|^$k=.*|$k=$v|" $CFG; else echo "$kv" >> $CFG; fi
          done
          grep -E "image.sysdir|abi.type" $CFG
      - name: boot tcg (no kvm on this runner)
        run: |
          SDK=$HOME/android-sdk
          export ANDROID_AVD_HOME=$HOME/.android/avd
          ( "$SDK/emulator/emulator" -avd ult -no-window -no-audio -no-boot-anim \
              -gpu swiftshader_indirect -no-snapshot -accel off -camera-back none \
              -memory 3072 -cores 4 > /tmp/emu.log 2>&1 & )
          t0=$(date +%s)
          if timeout 1500 bash -c 'export PATH=$HOME/android-sdk/platform-tools:$PATH; adb wait-for-device; while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" != "1" ]; do sleep 10; done'; then
            echo "BOOT_OK in $(( $(date +%s)-t0 ))s"
          else
            echo "BOOT_FAIL after $(( $(date +%s)-t0 ))s"; tail -60 /tmp/emu.log; exit 1
          fi
          export PATH=$HOME/android-sdk/platform-tools:$PATH
          echo "abi=$(adb shell getprop ro.product.cpu.abi)"
          adb exec-out screencap -p > /tmp/boot.png
      - name: wait apk fetch + install splits + smoke
        run: |
          export PATH=$HOME/android-sdk/platform-tools:$PATH
          if [ ! -f /tmp/apks/READY ]; then
            for i in $(seq 1 90); do [ -f /tmp/apks/READY ] && break; sleep 10; done
          fi
          [ -f /tmp/apks/READY ] || { echo FETCH_FAIL; tail -8 /tmp/fetch.log; exit 1; }
          H=$(sha256sum /tmp/apks/base.apk | cut -d" " -f1)
          echo "base sha256=$H"
          [ "$H" = "e698249baf99b14576be16bc711561885dc86f63526db77c696cd9177b7f1c25" ] || { echo HASH_MISMATCH; exit 1; }
          adb install-multiple -r /tmp/apks/base.apk /tmp/apks/config.*.apk 2>&1 | tail -3
          adb shell pm list packages | grep defi || { echo PKG_MISSING; exit 1; }
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell am start -W -n com.defi.wallet/com.defi.wallet.feature.splash.SplashActivity | tail -3
          sleep 60
          adb exec-out screencap -p > /tmp/smoke.png
          adb shell dumpsys activity activities | grep -E "ResumedActivity|topResumedActivity" | head -3
          adb logcat -d | grep -iE "FATAL|UnsatisfiedLink|dlopen.*couldn" | head -10 || true
      - name: collect
        if: always()
        run: |
          export PATH=$HOME/android-sdk/platform-tools:$PATH
          adb logcat -d > /tmp/logcat.txt 2>/dev/null || true
          cp /tmp/emu.log /tmp/ 2>/dev/null || true
          df -h / | tail -1 >> /tmp/df.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ult-boot-arm64v2
          if-no-files-found: warn
          path: |
            /tmp/smoke.png
            /tmp/boot.png
            /tmp/logcat.txt
            /tmp/emu.log
