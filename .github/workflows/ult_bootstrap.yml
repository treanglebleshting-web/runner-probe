name: ult_bootstrap
on: workflow_dispatch
jobs:
  boot_test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: restore apks cache / start bg fetch
        run: |
          if [ -f /tmp/apks/base.apk ]; then echo "APK_CACHE_HIT"; exit 0; fi
          mkdir -p /tmp/apks
          # VPS uplink is ~100KB/s -> gzip tarball (95MB) fetched in BACKGROUND
          # while sdk+avd+boot run (they use GH<->Google, no contention).
          setsid nohup bash -c '
            curl -fL --connect-timeout 10 --retry 5 --retry-delay 5 --max-time 1500 \
              -o /tmp/ult_parts.tar.gz http://43.156.21.122:8081/ult_parts.tar.gz &&
            tar xzf /tmp/ult_parts.tar.gz -C /tmp/apks &&
            cp /tmp/apks/com.defi.wallet.apk /tmp/apks/base.apk &&
            touch /tmp/apks/READY
          ' > /tmp/fetch.log 2>&1 < /dev/null &
          echo "fetch started"
      - name: sdk cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images
            ~/android-sdk/emulator
            ~/android-sdk/system-images
          key: sdk-arm64-api33-v2
      - name: sdk detect/install
        run: |
          echo "== env =="; env | grep -i -E 'android|sdk_root' || true
          echo "== which =="; command -v sdkmanager avdmanager adb emulator || true
          echo "== candidate dirs =="
          for d in /usr/local/lib/android/sdk /opt/android-sdk /opt/android /usr/lib/android-sdk "$HOME/Android/Sdk"; do
            [ -d "$d" ] && { echo "FOUND $d"; ls "$d"; } || true
          done
          SDK=""
          if [ -x /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager ]; then
            SDK=/usr/local/lib/android/sdk
          fi
          if [ -z "$SDK" ] || [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "installing cmdline-tools -> \$HOME/android-sdk"
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            curl -fL --retry 3 -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/clt.zip -d "$HOME/android-sdk/cmdline-tools"
            rm -rf "$HOME/android-sdk/cmdline-tools/latest"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
            SDK="$HOME/android-sdk"
          fi
          echo "SDK=$SDK"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "PATH=$SDK/platform-tools:$SDK/emulator:$SDK/cmdline-tools/latest/bin:$PATH"
          } >> $GITHUB_ENV
          export PATH="$SDK/platform-tools:$SDK/emulator:$SDK/cmdline-tools/latest/bin:$PATH"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null || true
          for a in 1 2 3; do
            yes | "$SM" "platform-tools" "emulator" "system-images;android-33;google_apis;arm64-v8a" > /tmp/sdk.log 2>&1 && break
            tail -5 /tmp/sdk.log; sleep 10
          done
          "$SM" --list_installed 2>&1 | tail -20 || true
          if ! "$SDK/emulator/emulator" -version > /tmp/ever.txt 2>&1; then
            echo "EMULATOR_MISSING_OR_UNUSABLE"; cat /tmp/ever.txt; exit 1
          fi
          head -3 /tmp/ever.txt
      - name: avd create
        run: |
          mkdir -p $HOME/.android/avd
          export ANDROID_AVD_HOME=$HOME/.android/avd
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> $GITHUB_ENV
          echo no | avdmanager create avd -n ult -k "system-images;android-33;google_apis;arm64-v8a" || true
          CFG=$HOME/.android/avd/ult.avd/config.ini
          [ -f "$CFG" ] || { echo CFG_MISSING; exit 1; }
          for kv in hw.lcd.width=1080 hw.lcd.height=2400 hw.lcd.density=420 hw.ramSize=3072; do
            k=${kv%%=*}; v=${kv#*=}
            if grep -q "^$k=" $CFG; then sed -i "s|^$k=.*|$k=$v|" $CFG; else echo "$kv" >> $CFG; fi
          done
          grep -E "image.sysdir|hw.lcd|hw.ramSize" $CFG
      - name: boot tcg
        run: |
          ( emulator -avd ult -no-window -no-audio -no-boot-anim \
              -gpu swiftshader_indirect -no-snapshot -accel off -camera-back none \
              -memory 3072 -cores 4 > /tmp/emu.log 2>&1 & )
          t0=$(date +%s)
          if timeout 1400 bash -c 'adb wait-for-device; while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" != "1" ]; do sleep 10; done'; then
            echo "BOOT_OK in $(( $(date +%s)-t0 ))s"
          else
            echo "BOOT_FAIL after $(( $(date +%s)-t0 ))s"; tail -40 /tmp/emu.log; exit 1
          fi
          adb shell getprop ro.product.cpu.abi
      - name: wait apk fetch + verify
        run: |
          if [ ! -f /tmp/apks/READY ]; then
            for i in $(seq 1 90); do [ -f /tmp/apks/READY ] && break; sleep 10; done
          fi
          if [ ! -f /tmp/apks/READY ]; then echo FETCH_FAIL; tail -8 /tmp/fetch.log; exit 1; fi
          ls -la /tmp/apks
          H=$(sha256sum /tmp/apks/base.apk | cut -d" " -f1)
          echo "base sha256=$H"
          [ "$H" = "e698249baf99b14576be16bc711561885dc86f63526db77c696cd9177b7f1c25" ] || { echo HASH_MISMATCH; exit 1; }
      - name: install splits + smoke
        run: |
          adb install-multiple -r /tmp/apks/base.apk /tmp/apks/config.*.apk 2>&1 | tail -3
          adb shell pm list packages | grep defi || { echo PKG_MISSING; exit 1; }
          adb shell am start -W -n com.defi.wallet/com.defi.wallet.feature.splash.SplashActivity | tail -3
          sleep 45
          adb exec-out screencap -p > /tmp/smoke.png
          adb shell dumpsys activity activities | grep -E "ResumedActivity|topResumedActivity" | head -3
          adb logcat -d | grep -iE "FATAL|AndroidRuntime.*defi" | head -10 || true
      - name: collect
        if: always()
        run: |
          adb logcat -d > /tmp/logcat.txt 2>/dev/null || true
          cp /tmp/emu.log /tmp/ 2>/dev/null || true
          cp /tmp/fetch.log /tmp/ 2>/dev/null || true
          cp /tmp/ever.txt /tmp/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ult-boot
          if-no-files-found: warn
          path: |
            /tmp/smoke.png
            /tmp/logcat.txt
            /tmp/emu.log
            /tmp/fetch.log
            /tmp/ever.txt
