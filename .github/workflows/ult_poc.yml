name: ult_poc
on: workflow_dispatch
jobs:
  poc:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: restore apks
        uses: actions/cache@v4
        with:
          path: /tmp/apks
          key: ult-apks-v1
      - name: sdk cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images
          key: sdk-arm64-api33-v1
      - name: sdk install
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          for a in 1 2 3; do
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "emulator" "system-images;android-33;google_apis;arm64-v8a" > /tmp/sdk.log 2>&1 && break
            tail -3 /tmp/sdk.log; sleep 10
          done
          echo "PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH" >> $GITHUB_ENV
      - name: avd create
        run: |
          mkdir -p $HOME/.android/avd
          export ANDROID_AVD_HOME=$HOME/.android/avd
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> $GITHUB_ENV
          echo no | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n ult -k "system-images;android-33;google_apis;arm64-v8a" || true
          CFG=$HOME/.android/avd/ult.avd/config.ini
          [ -f "$CFG" ] || { echo CFG_MISSING; exit 1; }
          for kv in hw.lcd.width=1080 hw.lcd.height=2400 hw.lcd.density=420 hw.ramSize=3072; do
            k=${kv%%=*}; v=${kv#*=}
            if grep -q "^$k=" $CFG; then sed -i "s|^$k=.*|$k=$v|" $CFG; else echo "$kv" >> $CFG; fi
          done
      - name: boot tcg
        run: |
          ( $ANDROID_HOME/emulator/emulator -avd ult -no-window -no-audio -no-boot-anim \
              -gpu swiftshader_indirect -no-snapshot -accel off -camera-back none \
              -memory 3072 -cores 4 > /tmp/emu.log 2>&1 & )
          t0=$(date +%s)
          if timeout 1500 bash -c 'adb wait-for-device; while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" != "1" ]; do sleep 10; done'; then
            echo "BOOT_OK in $(( $(date +%s)-t0 ))s"
          else
            echo "BOOT_FAIL"; tail -40 /tmp/emu.log; exit 1
          fi
      - name: install splits
        run: |
          ls -la /tmp/apks
          adb install-multiple -r /tmp/apks/base.apk /tmp/apks/config.*.apk 2>&1 | tail -3
          adb shell pm list packages | grep defi || { echo PKG_MISSING; exit 1; }
      - name: start app
        run: |
          adb shell am start -W -n com.defi.wallet/com.defi.wallet.feature.splash.SplashActivity | tail -2
          sleep 30
      - name: record + drive
        run: |
          mkdir -p /tmp/ult
          # rotate screenrecord segments (~28 min total) in background
          ( for i in $(seq 1 10); do
              adb shell "screenrecord --time-limit 170 --bit-rate 6000000 /sdcard/rec$i.mp4" || true
            done ) > /tmp/ult/rec.log 2>&1 &
          REC=$!
          python3 tools/ult_drive.py || true
          adb shell pkill -INT screenrecord || true
          sleep 5
          wait $REC || true
          for i in $(seq 1 10); do adb pull /sdcard/rec$i.mp4 /tmp/ult/ >/dev/null 2>&1 || true; done
          ls -la /tmp/ult/
      - name: collect
        if: always()
        run: |
          adb logcat -d > /tmp/ult/logcat.txt 2>/dev/null || true
          adb exec-out screencap -p > /tmp/ult/final.png 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ult-poc
          path: /tmp/ult/
          if-no-files-found: warn
